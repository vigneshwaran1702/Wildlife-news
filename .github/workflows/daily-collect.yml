name: Daily Wildlife Collector

on:
  schedule:
    - cron: '30 2 * * *'  # 8:00 AM IST daily
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Hit collector trigger endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.BACKEND_URL }}/api/collectors/trigger")
          echo "Response code: $response"
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Trigger failed with status $response"
            exit 1
          fi
