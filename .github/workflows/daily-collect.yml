name: Daily News Collection & Shift PDF Digest Workflow

on:
  schedule:
    # 2:30 UTC corresponds to 8:00 AM IST (Shift 3 Night Bulletin generation & Shift 1 Start)
    - cron: '30 2 * * *'
    # 11:30 UTC corresponds to 5:00 PM IST (Shift 1 Day Bulletin generation & Shift 2 Start)
    - cron: '30 11 * * *'
    # 15:30 UTC corresponds to 9:00 PM IST (Shift 2 Evening Bulletin generation & Shift 3 Start)
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  daily-news-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Trigger Remote Backend API (If BACKEND_URL configured)
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -n "$BACKEND_URL" ]; then
            echo "Triggering collectors API endpoint at $BACKEND_URL..."
            curl -sS --max-time 60 -X POST "${BACKEND_URL%/}/api/collectors/trigger" || echo "API trigger skipped or timed out, proceeding to local collector run."
          else
            echo "No BACKEND_URL secret configured. Skipping remote API curl call."
          fi

      - name: Run News Collection & Generate Shift PDF Reports
        run: |
          python -c "import sys; sys.path.append('backend'); from app.routes.collector_routes import trigger_collectors; print(trigger_collectors())"
          python scripts/update_today_feed.py
          python -c "import sys; sys.path.append('backend'); from app.scheduler.jobs import check_and_generate_due_pdfs; check_and_generate_due_pdfs()"

      - name: Commit and Push Updated Data & PDF Bulletins
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json pdfs/*.pdf n8n_downloads/*.pdf 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No database or PDF changes to commit."
          else
            git commit -m "auto: daily news collection and PDF digest update [skip ci]"
            git push || echo "Git push warning or no changes to push"
          fi
